# No `[project]` or `[build-system]` table, deliberately.
#
# `revitcheck` is not a distribution and must not become one. pyRevit puts
# `extensions/RevitCheck.extension/lib` on `sys.path` itself when it loads
# the extension, so the package is imported from where it is checked out —
# there is nothing to build, nothing to `pip install`, and no deployment
# copy to keep in sync (see `revitcheck/__init__.py` on why there is
# exactly one copy of the package).
#
# It also has no third-party dependencies: the whole package is stdlib
# (`json`, `hashlib`, `dataclasses`, `datetime`, `typing`) plus the Revit
# API, which only `adapters/revit_source.py` imports and which ships with
# Revit. `pytest` is the sole dev dependency — CI installs just that.
#
# This file exists only for the pytest config below, and as the record of
# why the build config that used to be here is gone: the `pdfchecker`
# distribution it declared was parked with the rest of the PDF/DWG
# pipeline (`git checkout pdf-dwg-final`, ARCHIVE-pdf-dwg.md).

[tool.pytest.ini_options]
testpaths = ["tests"]
