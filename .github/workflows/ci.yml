name: CI

# Replaced the Python workflow when the pyRevit extension was archived
# (ARCHIVE-pyrevit.md, 2026-09-07). That workflow byte-compiled and tested
# `revitcheck`, which no longer exists in the tree; leaving it in place
# would have meant a green tick that checked nothing.
#
# What this gates is the whole solution, and the important part is that it
# includes RevitCheck.Addin. That project targets net48 and compiles
# against the Revit API, but it needs neither Windows nor a Revit install
# to build: the API comes from the Nice3point reference-assembly NuGet
# packages and net48 from Microsoft.NETFramework.ReferenceAssemblies, the
# same way it already builds on the Mac this project is developed on.
#
# The Addin is exactly the half no test can reach - Core is covered by the
# test suite, but nothing in RevitCheck.Addin can be exercised without
# Revit running. Compiling it is the only automated check it gets, which
# is the same argument the archived Python workflow made for its
# `compileall` step over the adapter and button scripts, and the reason
# that step was called the most important line in the file.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore native/RevitCheck.sln

      # Includes the net48 Addin - see the header comment on why this is
      # the step that matters most here.
      - name: Build (whole solution, including the net48 Addin)
        run: dotnet build native/RevitCheck.sln --no-restore

      - name: Test
        run: dotnet test native/RevitCheck.sln --no-build --verbosity normal
