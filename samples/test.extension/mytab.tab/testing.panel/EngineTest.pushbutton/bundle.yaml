  Test
tooltip: >-
  Diagnostic only, not a real check. Prints one line to confirm the
  CPython 3 engine can launch a script at all on this machine, isolating
  whether the "Input string was not in a correct format" failure is
  specific to RevitCheck's own scripts or affects any #! python3 script.
  Safe to delete once the real buttons work.
author: Peter Griggs
