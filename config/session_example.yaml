# Example session-level rules file — PLANNING.md §4's "Project rule
# configuration — consolidated schema", loaded by
# checks/session_config.py's load_session_config(). Uploaded fresh
# alongside a session's drawings (§2's "Stateless by design" — nothing
# here persists server-side; re-supply or re-upload this file each
# session).
#
# Every key below maps onto a real RuleConfig field or enabled_rule_ids
# entry that a rule actually reads — see session_config.py's module
# docstring for the handful of §4 schema keys (extends_standard,
# title_block.custom_fields/reference_values,
# revision_schedule.column_mapping/require_cloud_for_every_row) that are
# accepted-but-not-yet-wired, reported as a warning rather than applied
# or silently dropped.

check_scope: "drafting_and_geometry"   # or "drafting_only" — §2

glossary:
  # project_glossary_path: "config/project_glossary.json"   # optional override
  session_additions: ["chainage", "T2DPAA", "Woronora"]

title_block:
  required_fields: ["drawing_no", "sheet_no", "amend_no"]

tolerances:
  rounding_grid:
    default: "5mm"
    setout_critical: "1mm"
  measurement_epsilon: "0.5mm"
  setout_critical_overrides:
    - layer: "C-BEARING"
  survey_tolerance:
    base_tolerance: "10mm"
    # per_hop_allowance: "3mm"   # accepted but not yet applied — see docstring

  # Stage 3 tolerances added after §4's schema was first written
  # (PLANNING.md §5b/§5's IFC subsection) — real RuleConfig fields,
  # previously only settable from Python.
  setout_reconstruction:
    setout_point_insert_substring: "SETOUT POINT"
    chain_link_tolerance_m: 0.01
    origin_pair_max_distance_m: 5.0
    bearing_pair_max_distance_m: 30.0
    pile_label_pair_max_distance_m: 5.0
    chain_continuation_max_gap_m: 10.0
  ifc:
    pile_footprint_max_m: 2.0
    pile_aspect_ratio_min: 3.0
    match_max_distance_m: 2.0
    setout_tolerance_mm: "10mm"
    # geometry.ifc_superstructure_coverage's shape heuristics (2026-08-15)
    deck_footprint_min_m: 5.0
    deck_aspect_ratio_max: 0.06
    beam_footprint_min_m: 5.0
    beam_aspect_ratio_min: 0.06
    beam_aspect_ratio_max: 0.5

rules:
  - id: "spelling.en_gb"
    enabled: true
  - id: "revision.cloud_matches_schedule"
    enabled: true
  # A rule id the catalog doesn't implement yet (§4's project-specific
  # primitives, or a future spec-extraction id, §6) is accepted, not a
  # load error — it's reported in LoadedSessionConfig.warnings instead.
  - id: "regex_text_check"
    enabled: true
    params: {pattern: "Grade 60", required_in: "rebar_notes"}
    source: "manual"
